name: Release
run-name: "Release ${{ github.ref_name }}"

# Everything this release does lives in cameraunlock-core's release-mod.yml.
# Only the values below are this mod's. Pinned to a commit SHA, never a branch:
# that workflow runs with contents:write, the Discord webhook and the Lopari PAT.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-mod.yml@a03c24290fae3a9c61f67adcb7c5ba4eedf69f20
    with:
      project-name: 'Quake II RTX Head Tracking'
      version-source: regex
      version-path: 'src/version.h'
      version-pattern: 'MOD_VERSION\s*=\s*"([^"]+)"'
      artifact-paths: 'src/ cameraunlock-core/ scripts/install.cmd scripts/uninstall.cmd'
      # Not the default 'package': validate-manifest chains through it and adds
      # a check of the built ZIP against the manifest's own file rows, so a
      # payload path that has moved fails the release rather than shipping.
      package-task: validate-manifest
      setup-msbuild: true
    permissions:
      contents: write
    secrets: inherit
